# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G. Together with the
# Kotlin daemon, which forks its own JVM, that reserves more than a 16 GB CI
# runner has: `assembleRelease` was killed with exit 143 and the job reported
# itself as cancelled. Both daemons are capped here; the release build peaks
# well under 4 GB.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
