# These manual workflows build Apple distribution packages.
# Run the app and protocol tests before starting a release build.

definitions:
  scripts:
    - &assert_telemetry
      name: Check the telemetry values arrived
      script: |
        set -e
        missing=
        for name in SENTRY_DSN RYBBIT_HOST RYBBIT_SITE_ID TELEMETRY_ENVIRONMENT; do
          eval "value=\${$name}"
          if [ -z "$value" ]; then
            missing="$missing $name"
          else
            echo "$name arrived (${#value} characters)"
          fi
        done
        if [ -n "$missing" ]; then
          echo "Empty telemetry values:$missing - this build would report nowhere."
          exit 1
        fi

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: chatujme-asc-key
    environment:
      groups:
        - nks-talk-telemetry
        # Holds CERTIFICATE_PRIVATE_KEY. Without it `fetch-signing-files
        # --create` has no private key for any existing distribution
        # certificate and tries to issue a new one - and Apple caps those at
        # three, which this team has already used.
        - appstore_credentials
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      # First, and not optional: with Swift Package Manager on, the build
      # resolves sentry-cocoa itself instead of honouring Podfile.lock, and
      # the two versions drift until the Swift compile fails. Learned the hard
      # way on two other apps in this account.
      - name: Pin dependency resolution to CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - *assert_telemetry
      - name: Prepare the iOS workspace
        script: cd apps/mobile && flutter build ios --config-only --release --no-codesign
      - name: Set up signing
        script: |
          set -e
          keychain initialize
          for id in com.nkshub.nextcloudtalk \
                    com.nkshub.nextcloudtalk.NotificationService \
                    com.nkshub.nextcloudtalk.ShareExtension \
                    com.nkshub.nextcloudtalk.BroadcastExtension; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE
          done
          keychain add-certificates
          cd apps/mobile && xcode-project use-profiles
      - name: Build IPA
        script: |
          set -eu
          cd apps/mobile
          flutter build ipa --release --no-pub \
            --dart-define="PUSH_GATEWAY_ORIGIN=$PUSH_GATEWAY_ORIGIN" \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testeři"
          - "Externí testeři"

  macos-release:
    name: macOS build
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Without this the App Store Connect CLI has no credentials at all, and
    # `fetch-signing-files` fails with "argument --issuer-id: Missing value
    # ISSUER_ID". That was the whole reason macOS builds went out unsigned.
    integrations:
      app_store_connect: chatujme-asc-key
    environment:
      groups:
        - nks-talk-telemetry
        - appstore_credentials
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pin dependency resolution to CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - *assert_telemetry
      - name: Set up signing
        script: |
          set -o pipefail
          {
          set -e
          umask 077
          key=${APP_STORE_CONNECT_PRIVATE_KEY:?Missing App Store Connect private key}
          notary_key=$(mktemp /tmp/owntalk-notary.XXXXXX)
          trap 'rm -f "$notary_key"' EXIT
          pem_header_pattern='-----BEGIN[ ]PRIVATE KEY-----'
          if [[ "$key" = /* && -f "$key" ]]; then
            cp "$key" "$notary_key"
          elif [[ "$key" =~ $pem_header_pattern ]]; then
            printf '%b\n' "$key" > "$notary_key"
          else
            printf '%s' "$key" | base64 --decode > "$notary_key"
          fi
          openssl pkey -in "$notary_key" -noout
          echo "OWNTALK_NOTARY_KEY_PATH=$notary_key" >> "$CM_ENV"
          KC=nks-build.keychain
          security create-keychain -p ci-temp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci-temp "$KC"
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o /tmp/AppleRoot.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import /tmp/DeveloperIDG2CA.cer -k "$KC" -T /usr/bin/codesign
          security import /tmp/AppleRoot.cer -k "$KC" -T /usr/bin/codesign
          # THE ARCHIVE MUST CARRY A SHA-1 MAC. `security import` says "MAC
          # verification failed during PKCS12 import (wrong password?)" for
          # THREE different faults - a corrupt file, a wrong password, and a MAC
          # algorithm Apple's Security framework cannot compute - and that
          # ambiguity cost four builds. OpenSSL 3 exports a SHA-256 MAC by
          # default; SecPKCS12Import only does SHA-1, so a perfectly valid
          # archive with the right password is rejected with a message about the
          # password. The export therefore needs `-macalg sha1` (see the README
          # beside the key). The two innocent causes are ruled out before the
          # import runs: the digest proves the transfer arrived intact, openssl
          # judges the password on its own. Neither line reveals either secret -
          # a length and a digest of a secret are not the secret.
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/devid.p12
          echo "p12 bytes $(wc -c < /tmp/devid.p12), password length ${#MACOS_CERTIFICATE_PASSWORD}"
          openssl pkcs12 -in /tmp/devid.p12 -passin "pass:$MACOS_CERTIFICATE_PASSWORD" -nokeys -clcerts -noout
          security import /tmp/devid.p12 -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/devid.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-temp "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC" | grep -q 'Developer ID Application:'
          app-store-connect profiles list --type MAC_APP_DIRECT --state ACTIVE --save >/dev/null
          cd apps/mobile
          flutter build macos --config-only --release \
            --dart-define="PUSH_GATEWAY_ORIGIN=$PUSH_GATEWAY_ORIGIN" \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT
          trap - EXIT
          } 2>&1 | tee /tmp/macos-setup.log
      - name: Build the app
        script: |
          set -o pipefail
          cd apps/mobile
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build \
            2>&1 | tee /tmp/macos-build.log
      # The entitlements in the source carry Xcode variables. `codesign` reads
      # the file verbatim and amfid rejects an unexpanded one with "No matching
      # profile found", so they are expanded first.
      - name: Sign with Developer ID
        script: |
          set -eo pipefail
          cd apps/mobile
          {
            security unlock-keychain -p ci-temp nks-build.keychain
            APP=build/macos/Build/Products/Release/nextcloudtalk.app
            ID=$(security find-identity -v -p codesigning nks-build.keychain | awk '/"Developer ID Application:/{print $2}')
            test -n "$ID"
            python3 tool/codemagic_macos_profiles.py "$APP" "$APPLE_TEAM_ID" "$ID"
            bash tool/sign_sparkle.sh "$APP" "$ID"
            for f in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/Frameworks/*.dylib; do
              [ -e "$f" ] || continue
              codesign --force --options runtime --timestamp --sign "$ID" "$f"
            done
            for ext in "$APP"/Contents/PlugIns/*.appex; do
              [ -e "$ext" ] || continue
              codesign --force --options runtime --timestamp --entitlements /tmp/owntalk-appex.entitlements --sign "$ID" "$ext"
            done
            codesign --force --options runtime --timestamp --entitlements /tmp/owntalk-app.entitlements --sign "$ID" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          } 2>&1 | tee /tmp/macos-sign.log
      - name: Verify the signature carries the sandbox
        script: |
          APP=apps/mobile/build/macos/Build/Products/Release/nextcloudtalk.app
          codesign -dv --entitlements - "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "TeamIdentifier=$APPLE_TEAM_ID" /tmp/sig.txt             || { echo "Unsigned or wrong team - refusing to publish."; exit 1; }
          codesign -d --entitlements - "$APP" 2>&1 | grep -q "app-sandbox"             || { echo "No app-sandbox entitlement - the app would lose its account."; exit 1; }
      - name: Notarize and package the app
        script: |
          set -euo pipefail
          cd apps/mobile/build/macos/Build/Products/Release
          app=nextcloudtalk.app
          trap 'rm -f "$OWNTALK_NOTARY_KEY_PATH"' EXIT
          signed_zip=owntalk-macos-signed-for-notarization.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" "$signed_zip"
          xcrun notarytool submit "$signed_zip" --key "$OWNTALK_NOTARY_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait | tee /tmp/owntalk-notary.log
          grep -q 'status: Accepted' /tmp/owntalk-notary.log
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")
          zip="nks-talk-macos-$version-$build.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          rm "$signed_zip"
    artifacts:
      - apps/mobile/build/macos/Build/Products/Release/nks-talk-macos-*.zip
      - apps/mobile/build/macos/Build/Products/Release/nks-talk-macos-*.zip.sha256
      - apps/mobile/build/macos/Build/Products/Release/owntalk-macos-signed-for-notarization.zip
      - /tmp/owntalk-notary.log
      - /tmp/macos-build.log
      - /tmp/macos-sign.log
      - /tmp/macos-setup.log
