# The Apple half of CI: iOS and macOS. Android, Linux and the Windows
# installer live in `.github/workflows/build.yml` on GitHub-hosted runners,
# because this Codemagic plan offers no Linux or Windows machine at all -
# `linux`, `linux_x2` and `windows_x2` are all refused with "The selected
# instance type is not available with the current billing plan".
#
# The Mac this project normally builds on (`build-mac`, driven over the RemoteCmd
# relay) was offline for builds 43 and 44, which is why both shipped to Google
# Play with no TestFlight half at all. This file exists so that stops being a
# single point of failure.
#
# Both workflows run both test suites before they build anything. An artifact
# that nobody tested is worth less than no artifact.
#
# No `triggering:` section on purpose - builds are started deliberately
# (`POST /builds`), so a push does not spend macOS minutes.
#
# `flutter` is pinned rather than tracking `stable`: a newer analyzer than the
# one this tree is developed against rejects three call sites in
# `apps/mobile/test/attachment_repository_test.dart`, and CI drifting ahead of
# the working tree turns every Flutter release into a red build.
#
# Nothing secret is in this file. The telemetry values come from the Codemagic
# environment group `nks-talk-telemetry` and hold what `apps/mobile/
# telemetry.env` holds locally - that file is gitignored and must stay that
# way. No Android signing material is here or in this Codemagic app; the
# upload keystore lives only in GitHub secrets.

definitions:
  scripts:
    # The Google Services plugin refuses to configure without this file, and
    # the real one is not in the repository. Without it the manifest-merge test
    # fails on a Gradle configuration error instead of on what it tests. The
    # placeholder carries no credential, and the Android workflow has already
    # written the real file by the time this runs, so it leaves it alone.
    - &placeholder_firebase
      name: Write a placeholder Firebase config
      script: |
        set -e
        cd apps/mobile/android/app
        if [ -f google-services.json ]; then
          echo "Firebase config already present - leaving it alone."
          exit 0
        fi
        cat > google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "ci-placeholder",
            "storage_bucket": "ci-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "com.nkshub.nextcloudtalk"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "ci-placeholder-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        JSON

    # The macOS build of 2026-09-02 went out with every telemetry define empty
    # and nothing said so - the app just reported nowhere. Existing in the
    # variable group is not the same as arriving in the build, so this checks
    # arrival. Lengths only; the values are secure and never printed.
    - &assert_telemetry
      name: Check the telemetry values arrived
      script: |
        set -e
        missing=
        for name in SENTRY_DSN RYBBIT_HOST RYBBIT_SITE_ID TELEMETRY_ENVIRONMENT; do
          eval "value=\${$name}"
          if [ -z "$value" ]; then
            missing="$missing $name"
          else
            echo "$name arrived (${#value} characters)"
          fi
        done
        if [ -n "$missing" ]; then
          echo "Empty telemetry values:$missing - this build would report nowhere."
          exit 1
        fi

    - &test_protocol
      name: Test talk_protocol
      script: |
        set -e
        cd packages/talk_protocol
        dart pub get
        dart analyze lib test
        dart test --reporter expanded

    # `flutter test` includes the Android manifest-merge test, which shells out
    # to the Gradle wrapper - hence the JDK and the placeholder config above.
    - &test_app
      name: Test apps/mobile
      script: |
        set -e
        cd apps/mobile
        flutter pub get
        flutter analyze lib test
        flutter test --reporter expanded

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: chatujme-asc-key
    environment:
      groups:
        - nks-talk-telemetry
        # Holds CERTIFICATE_PRIVATE_KEY. Without it `fetch-signing-files
        # --create` has no private key for any existing distribution
        # certificate and tries to issue a new one - and Apple caps those at
        # three, which this team has already used.
        - appstore_credentials
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      # First, and not optional: with Swift Package Manager on, the build
      # resolves sentry-cocoa itself instead of honouring Podfile.lock, and
      # the two versions drift until the Swift compile fails. Learned the hard
      # way on two other apps in this account.
      - name: Pin dependency resolution to CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - *assert_telemetry
      - *placeholder_firebase
      - *test_protocol
      - *test_app
      - name: Install pods
        script: cd apps/mobile/ios && pod install
      # Script-based, not the declarative `ios_signing:` block: that one only
      # FETCHES an existing profile and fails with "No matching profiles found
      # for bundle identifier … and distribution type app_store" when there is
      # none (build 6a9a7a88). `--create` makes the App ID and the profile.
      # All three targets need one - the app, the notification service and the
      # share extension - because the archive export signs every embedded
      # bundle, not just the app.
      - name: Set up signing
        script: |
          set -e
          keychain initialize
          for id in com.nkshub.nextcloudtalk \
                    com.nkshub.nextcloudtalk.NotificationService \
                    com.nkshub.nextcloudtalk.ShareExtension; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE --create
          done
          keychain add-certificates
          cd apps/mobile && xcode-project use-profiles
      - name: Build IPA
        script: |
          cd apps/mobile
          flutter build ipa --release \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-release:
    name: macOS build
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Without this the App Store Connect CLI has no credentials at all, and
    # `fetch-signing-files` fails with "argument --issuer-id: Missing value
    # ISSUER_ID". That was the whole reason macOS builds went out unsigned.
    integrations:
      app_store_connect: chatujme-asc-key
    environment:
      groups:
        - nks-talk-telemetry
        - appstore_credentials
        - nks-talk-github
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Pin dependency resolution to CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - *assert_telemetry
      - *placeholder_firebase
      - *test_protocol
      - *test_app
      - name: Install pods
        script: cd apps/mobile/macos && pod install
      # The first run failed here, and the message was precise: Xcode wanted a
      # Mac App Development provisioning profile for the app AND for the
      # notification service extension, found neither, and automatic signing
      # was off. The account already holds the identities, so they are fetched
      # rather than assumed.
      # Direct distribution, not development: the artifact is a zip handed to
      # testers, so a development profile would only run on registered Macs.
      # Nothing here may fail quietly - see the build step for why.
      # The Developer ID certificate in the team was issued by hand years ago
      # and its private key lives only in one login keychain, so the CI had no
      # identity to sign with. A second certificate was issued against a CSR
      # built from the key the CI already holds; this installs that pair.
      # A raw .p12 is not enough on its own. Two things bit here, both visible
      # in the signing log of build 18: `unable to build chain to self-signed
      # root`, because Apple's Developer ID intermediate is not on the machine,
      # and `errSecInternalComponent`, which is what codesign says when it can
      # reach the key but is not allowed to use it without a prompt. The
      # partition list grants that permission; the two CA certificates complete
      # the chain.
      - name: Set up signing
        script: |
          set -e
          KC=/Users/builder/Library/Keychains/nks-build.keychain-db
          security create-keychain -p ci-temp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci-temp "$KC"
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o /tmp/AppleRoot.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import /tmp/DeveloperIDG2CA.cer -k "$KC" -T /usr/bin/codesign
          security import /tmp/AppleRoot.cer -k "$KC" -T /usr/bin/codesign
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/devid.p12
          security import /tmp/devid.p12 -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/devid.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-temp "$KC"
          security list-keychains -d user -s "$KC" /Users/builder/Library/Keychains/login.keychain-db
          security find-identity -v -p codesigning
          cd apps/mobile
          flutter build macos --config-only --release \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT
      - name: Build the app
        script: |
          set -o pipefail
          cd apps/mobile
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build \
            2>&1 | tee /tmp/macos-build.log
      # The entitlements in the source carry Xcode variables. `codesign` reads
      # the file verbatim and amfid rejects an unexpanded one with "No matching
      # profile found", so they are expanded first.
      - name: Sign with Developer ID
        script: |
          set -o pipefail
          cd apps/mobile
          {
            security unlock-keychain -p ci-temp /Users/builder/Library/Keychains/nks-build.keychain-db
            APP=build/macos/Build/Products/Release/nextcloudtalk.app
            python3 -c "import io,sys; t=io.open(sys.argv[1]).read(); t=t.replace(chr(36)+'(APS_ENVIRONMENT)','production'); t=t.replace(chr(36)+'(AppIdentifierPrefix)','TEAMID0000.'); io.open(sys.argv[2],'w').write(t)" macos/Runner/Release.entitlements /tmp/release.entitlements
            ID="${MACOS_SIGNING_IDENTITY}"
            # Inside out: a nested bundle signed after its container invalidates
            # the container's seal.
            for f in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/Frameworks/*.dylib; do
              [ -e "$f" ] || continue
              codesign --force --options runtime --timestamp --sign "$ID" "$f"
            done
            for ext in "$APP"/Contents/PlugIns/*.appex; do
              [ -e "$ext" ] || continue
              codesign --force --options runtime --timestamp --sign "$ID" "$ext"
            done
            codesign --force --options runtime --timestamp --entitlements /tmp/release.entitlements --sign "$ID" "$APP"
            codesign --verify --strict --verbose=2 "$APP"
          } 2>&1 | tee /tmp/macos-sign.log
      - name: Verify the signature carries the sandbox
        script: |
          APP=apps/mobile/build/macos/Build/Products/Release/nextcloudtalk.app
          codesign -dv --entitlements - "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "TeamIdentifier=TEAMID0000" /tmp/sig.txt             || { echo "Unsigned or wrong team - refusing to publish."; exit 1; }
          codesign -d --entitlements - "$APP" 2>&1 | grep -q "app-sandbox"             || { echo "No app-sandbox entitlement - the app would lose its account."; exit 1; }
      # Zipped rather than shipped as a .app directory, because an artifact
      # download would otherwise lose the bundle's symlinks and the result
      # would not launch.
      - name: Package the app
        script: |
          cd apps/mobile/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app nks-talk-macos.zip
      # Pushed from here rather than pulled by a GitHub job: that job would
      # have to guess when a Codemagic build was started and how long it takes.
      # Nothing to guess if the build uploads when it is done. Only on a tag
      # build - a branch build has no release to attach to.
      - name: Attach the zip to the GitHub release
        script: |
          set -e
          if [ -z "$CM_TAG" ]; then
            echo "Not a tag build - nothing to attach."
            exit 0
          fi
          cd apps/mobile/build/macos/Build/Products/Release
          shasum -a 256 nks-talk-macos.zip
          GH_TOKEN=$GITHUB_RELEASE_TOKEN gh release upload "$CM_TAG" \
            nks-talk-macos.zip --clobber --repo nks-hub/nks-nextcloud-talk
    artifacts:
      - apps/mobile/build/macos/Build/Products/Release/nks-talk-macos.zip
      - /tmp/macos-build.log
      - /tmp/macos-sign.log
