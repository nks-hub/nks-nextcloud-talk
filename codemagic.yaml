# Apple release workflows. Start both manually from the same release branch.
# The tag-triggered workflows in GitHub Actions handle the other platforms.

definitions:
  scripts:
    # The Google Services plugin refuses to configure without this file, and
    # the real one is not in the repository. Without it the manifest-merge test
    # fails on a Gradle configuration error instead of on what it tests. The
    # placeholder carries no credential, and the Android workflow has already
    # written the real file by the time this runs, so it leaves it alone.
    - &placeholder_firebase
      name: Write a placeholder Firebase config
      script: |
        set -e
        cd apps/mobile/android/app
        if [ -f google-services.json ]; then
          echo "Firebase config already present - leaving it alone."
          exit 0
        fi
        cat > google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "ci-placeholder",
            "storage_bucket": "ci-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "com.nkshub.nextcloudtalk"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "ci-placeholder-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        JSON

    # The macOS build of 2026-09-02 went out with every telemetry define empty
    # and nothing said so - the app just reported nowhere. Existing in the
    # variable group is not the same as arriving in the build, so this checks
    # arrival. Lengths only; the values are secure and never printed.
    - &assert_telemetry
      name: Check the telemetry values arrived
      script: |
        set -e
        missing=
        for name in SENTRY_DSN RYBBIT_HOST RYBBIT_SITE_ID TELEMETRY_ENVIRONMENT; do
          eval "value=\${$name}"
          if [ -z "$value" ]; then
            missing="$missing $name"
          else
            echo "$name arrived (${#value} characters)"
          fi
        done
        if [ -n "$missing" ]; then
          echo "Empty telemetry values:$missing - this build would report nowhere."
          exit 1
        fi

    - &test_protocol
      name: Test talk_protocol
      script: |
        set -e
        cd packages/talk_protocol
        dart pub get
        dart analyze lib test
        dart test --reporter expanded

    # `flutter test` includes the Android manifest-merge test, which shells out
    # to the Gradle wrapper - hence the JDK and the placeholder config above.
    - &test_app
      name: Test apps/mobile
      script: |
        set -e
        cd apps/mobile
        flutter pub get
        flutter analyze lib test
        flutter test --reporter expanded

    # The Apple unit suites, which nothing ran until 7 September 2026 — this
    # file had no `xcodebuild test` at all, so `RunnerTests` could have been red
    # for weeks with nothing to say so.
    #
    # DO NOT ADD `CODE_SIGNING_ALLOWED=NO` HERE. It is on the macOS BUILD step
    # for a good reason and it is poison for these tests: an unsigned host
    # embeds no entitlements, `Runner.entitlements` never reaches the app, and
    # the four `PushNotificationRouteStore` tests fail on a keychain query the
    # system refuses. That looks exactly like a broken route store and is not
    # one. A simulator build signs itself ad-hoc, so nothing has to be fetched
    # or unlocked here.
    #
    # The destination is resolved to a UDID rather than written as a name:
    # `OS:latest` resolves against the newest SDK, which on a machine whose
    # simulators lag behind it names a runtime with no devices, and xcodebuild
    # exits 70 without saying why.
    - &test_apple
      name: Test the Apple targets
      script: |
        set -e
        cd apps/mobile
        flutter build ios --config-only --simulator
        udid=$(xcrun simctl list devices available --json           | python3 -c 'import json,sys;
        devices = json.load(sys.stdin)["devices"]
        for runtime, entries in sorted(devices.items()):
            if "iOS" not in runtime:
                continue
            for entry in entries:
                if entry.get("isAvailable") and "iPhone" in entry["name"]:
                    print(entry["udid"]); raise SystemExit
        raise SystemExit("no available iPhone simulator")')
        echo "Testing on simulator $udid"
        for scheme in Runner ShareExtensionTests; do
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme "$scheme"             -destination "platform=iOS Simulator,id=$udid"
        done
        flutter test -d "$udid" integration_test/clipboard_image_ios_test.dart

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: chatujme-asc-key
    environment:
      groups:
        - nks-talk-telemetry
        # Holds CERTIFICATE_PRIVATE_KEY. Without it `fetch-signing-files
        # --create` has no private key for any existing distribution
        # certificate and tries to issue a new one - and Apple caps those at
        # three, which this team has already used.
        - appstore_credentials
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      java: 21
    scripts:
      # First, and not optional: with Swift Package Manager on, the build
      # resolves sentry-cocoa itself instead of honouring Podfile.lock, and
      # the two versions drift until the Swift compile fails. Learned the hard
      # way on two other apps in this account.
      - name: Pin dependency resolution to CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - *assert_telemetry
      - *placeholder_firebase
      - *test_protocol
      - *test_app
      - name: Install pods
        script: cd apps/mobile/ios && pod install
      # After the pods, because the workspace has to exist, and before the
      # signing, because these need no identity of their own.
      - *test_apple
      # Script-based, not the declarative `ios_signing:` block: that one only
      # FETCHES an existing profile and fails with "No matching profiles found
      # for bundle identifier … and distribution type app_store" when there is
      # none (build 6a9a7a88). `--create` makes the App ID and the profile.
      # All three targets need one - the app, the notification service and the
      # share extension - because the archive export signs every embedded
      # bundle, not just the app.
      - name: Set up signing
        script: |
          set -e
          keychain initialize
          for id in com.nkshub.nextcloudtalk \
                    com.nkshub.nextcloudtalk.NotificationService \
                    com.nkshub.nextcloudtalk.ShareExtension; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE --create
          done
          keychain add-certificates
          cd apps/mobile && xcode-project use-profiles
      - name: Build IPA
        script: |
          set -eu
          cd apps/mobile
          flutter build ipa --release \
            --dart-define="PUSH_GATEWAY_ORIGIN=$PUSH_GATEWAY_ORIGIN" \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testeři"
          - "Externí testeři"

  macos-release:
    name: macOS build
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Without this the App Store Connect CLI has no credentials at all, and
    # `fetch-signing-files` fails with "argument --issuer-id: Missing value
    # ISSUER_ID". That was the whole reason macOS builds went out unsigned.
    integrations:
      app_store_connect: chatujme-asc-key
    environment:
      groups:
        - nks-talk-telemetry
        - appstore_credentials
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      java: 21
    scripts:
      - name: Pin dependency resolution to CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - *assert_telemetry
      - *placeholder_firebase
      - *test_protocol
      - *test_app
      - name: Install pods
        script: cd apps/mobile/macos && pod install
      # The first run failed here, and the message was precise: Xcode wanted a
      # Mac App Development provisioning profile for the app AND for the
      # notification service extension, found neither, and automatic signing
      # was off. The account already holds the identities, so they are fetched
      # rather than assumed.
      # Direct distribution, not development: the artifact is a zip handed to
      # testers, so a development profile would only run on registered Macs.
      # Nothing here may fail quietly - see the build step for why.
      # The Developer ID certificate in the team was issued by hand years ago
      # and its private key lives only in one login keychain, so the CI had no
      # identity to sign with. A second certificate was issued against a CSR
      # built from the key the CI already holds; this installs that pair.
      # A raw .p12 is not enough on its own. Two things bit here, both visible
      # in the signing log of build 18: `unable to build chain to self-signed
      # root`, because Apple's Developer ID intermediate is not on the machine,
      # and `errSecInternalComponent`, which is what codesign says when it can
      # reach the key but is not allowed to use it without a prompt. The
      # partition list grants that permission; the two CA certificates complete
      # the chain.
      - name: Set up signing
        script: |
          set -o pipefail
          {
          set -e
          KC=nks-build.keychain
          security create-keychain -p ci-temp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci-temp "$KC"
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o /tmp/AppleRoot.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import /tmp/DeveloperIDG2CA.cer -k "$KC" -T /usr/bin/codesign
          security import /tmp/AppleRoot.cer -k "$KC" -T /usr/bin/codesign
          # THE ARCHIVE MUST CARRY A SHA-1 MAC. `security import` says "MAC
          # verification failed during PKCS12 import (wrong password?)" for
          # THREE different faults - a corrupt file, a wrong password, and a MAC
          # algorithm Apple's Security framework cannot compute - and that
          # ambiguity cost four builds. OpenSSL 3 exports a SHA-256 MAC by
          # default; SecPKCS12Import only does SHA-1, so a perfectly valid
          # archive with the right password is rejected with a message about the
          # password. The export therefore needs `-macalg sha1` (see the README
          # beside the key). The two innocent causes are ruled out before the
          # import runs: the digest proves the transfer arrived intact, openssl
          # judges the password on its own. Neither line reveals either secret -
          # a length and a digest of a secret are not the secret.
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/devid.p12
          echo "p12 bytes $(wc -c < /tmp/devid.p12), password length ${#MACOS_CERTIFICATE_PASSWORD}"
          openssl pkcs12 -in /tmp/devid.p12 -passin "pass:$MACOS_CERTIFICATE_PASSWORD" -nokeys -clcerts -noout
          security import /tmp/devid.p12 -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/devid.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-temp "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC" | grep -q 'Developer ID Application:'
          app-store-connect profiles list --type MAC_APP_DIRECT --state ACTIVE --save >/dev/null
          cd apps/mobile
          flutter build macos --config-only --release \
            --dart-define="PUSH_GATEWAY_ORIGIN=$PUSH_GATEWAY_ORIGIN" \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT
          } 2>&1 | tee /tmp/macos-setup.log
      - name: Build the app
        script: |
          set -o pipefail
          cd apps/mobile
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build \
            2>&1 | tee /tmp/macos-build.log
      # The entitlements in the source carry Xcode variables. `codesign` reads
      # the file verbatim and amfid rejects an unexpanded one with "No matching
      # profile found", so they are expanded first.
      - name: Sign with Developer ID
        script: |
          set -o pipefail
          cd apps/mobile
          {
            security unlock-keychain -p ci-temp nks-build.keychain
            APP=build/macos/Build/Products/Release/nextcloudtalk.app
            ID=$(security find-identity -v -p codesigning nks-build.keychain | awk '/"Developer ID Application:/{print $2}')
            test -n "$ID"
            python3 tool/codemagic_macos_profiles.py "$APP" "$APPLE_TEAM_ID" "$ID"
            bash tool/sign_sparkle.sh "$APP" "$ID"
            for f in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/Frameworks/*.dylib; do
              [ -e "$f" ] || continue
              codesign --force --options runtime --timestamp --sign "$ID" "$f"
            done
            for ext in "$APP"/Contents/PlugIns/*.appex; do
              [ -e "$ext" ] || continue
              codesign --force --options runtime --timestamp --entitlements /tmp/owntalk-appex.entitlements --sign "$ID" "$ext"
            done
            codesign --force --options runtime --timestamp --entitlements /tmp/owntalk-app.entitlements --sign "$ID" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          } 2>&1 | tee /tmp/macos-sign.log
      - name: Verify the signature carries the sandbox
        script: |
          APP=apps/mobile/build/macos/Build/Products/Release/nextcloudtalk.app
          codesign -dv --entitlements - "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "TeamIdentifier=$APPLE_TEAM_ID" /tmp/sig.txt             || { echo "Unsigned or wrong team - refusing to publish."; exit 1; }
          codesign -d --entitlements - "$APP" 2>&1 | grep -q "app-sandbox"             || { echo "No app-sandbox entitlement - the app would lose its account."; exit 1; }
      - name: Notarize and package the app
        script: |
          set -euo pipefail
          cd apps/mobile/build/macos/Build/Products/Release
          app=nextcloudtalk.app
          out=$(mktemp -d)
          trap 'rm -f "$out/api.p8" "$out/notarize.zip"; rmdir "$out"' EXIT
          umask 077
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$out/api.p8"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out/notarize.zip"
          xcrun notarytool submit "$out/notarize.zip" --key "$out/api.p8" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait | tee /tmp/owntalk-notary.log
          grep -q 'status: Accepted' /tmp/owntalk-notary.log
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")
          zip="nks-talk-macos-$version-$build.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
    artifacts:
      - apps/mobile/build/macos/Build/Products/Release/nks-talk-macos-*.zip
      - apps/mobile/build/macos/Build/Products/Release/nks-talk-macos-*.zip.sha256
      - /tmp/owntalk-notary.log
      - /tmp/macos-build.log
      - /tmp/macos-sign.log
      - /tmp/macos-setup.log
