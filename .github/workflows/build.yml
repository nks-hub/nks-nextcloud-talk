# Android, Linux and the Windows installer. The Apple half is on Codemagic
# (`codemagic.yaml`) because that plan has Macs and this one does not have to.
#
# The suites run once on Ubuntu and gate both Linux builds. Windows runs them
# again on purpose: two tests in `windows_notification_integration_test` drive
# the native Windows notification channel and skip everywhere else, so an
# Ubuntu-only run never executes them.
#
# Costs, because this repository is private and these minutes are billed:
# Linux counts 1x, Windows 2x. One run of tests + android + linux is roughly 57
# billed minutes, and a busy day pushes to `main` many times — that alone ate
# 90% of the monthly allowance by 5 September 2026. So nothing runs on a push
# to a branch any more: the whole workflow is gated to manual runs and `v*`
# tags, the same way the Windows job already was (90 billed minutes on its
# own, more than the other three together). The suites still run on every
# developer machine before a push.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `stable`: a newer analyzer than the one this tree is developed
  # against rejects three call sites in attachment_repository_test.dart.
  FLUTTER_VERSION: 3.44.4

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The Google Services plugin refuses to configure without this file and
      # the real one is not in the repository, so the manifest-merge test would
      # die on a Gradle configuration error rather than on what it tests. The
      # placeholder carries no credential.
      - name: Write a placeholder Firebase config
        run: |
          cat > apps/mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.nkshub.nextcloudtalk"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Test talk_protocol
        working-directory: packages/talk_protocol
        run: |
          dart pub get
          dart analyze lib test
          dart test --reporter expanded
      # `flutter pub get` writes the gitignored android/local.properties that
      # settings.gradle.kts requires, and `flutter test` includes a test that
      # shells out to the Gradle wrapper - hence the JDK above.
      - name: Test apps/mobile
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test --reporter expanded
      # This repository is public: nothing that names the operator's hosts,
      # machines, accounts or identifiers may be committed (CONTRIBUTING.md).
      - name: Public repository gate
        run: python3 tool/public_repo_gate.py

  android:
    name: android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The real config, not the placeholder: a release APK whose FCM project
      # is `ci-placeholder` takes no push at all, and it looks exactly like a
      # working build until someone waits for a notification.
      - name: Restore the Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d \
            > apps/mobile/android/app/google-services.json
      # Gradle refuses to fall back to the debug key on purpose: Play rejects a
      # release signed with it, and a silent substitution surfaces at upload.
      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      # `assembleRelease` is finalized by the license gate, which runs
      # `python3 tool/release_license_gate.py` over the assembled APK.
      # Two full release builds plus the Gradle caches do not fit next to the
      # preinstalled toolchains: the runner ran out of disk mid-`appbundle` and
      # the job came back as cancelled rather than failed, which reads like an
      # infrastructure hiccup instead of what it is. The Android SDK stays.
      - name: Make room on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Build the release APK and AAB
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RYBBIT_HOST: ${{ secrets.RYBBIT_HOST }}
          RYBBIT_SITE_ID: ${{ secrets.RYBBIT_SITE_ID }}
          TELEMETRY_ENVIRONMENT: ${{ secrets.TELEMETRY_ENVIRONMENT }}
          PUSH_GATEWAY_ORIGIN: ${{ secrets.PUSH_GATEWAY_ORIGIN }}
        working-directory: apps/mobile
        run: |
          test -n "$SENTRY_DSN" && test -n "$RYBBIT_HOST" && test -n "$PUSH_GATEWAY_ORIGIN"
          for target in apk appbundle; do
            flutter build $target --release \
              --dart-define=PUSH_GATEWAY_ORIGIN=$PUSH_GATEWAY_ORIGIN \
              --dart-define=SENTRY_DSN=$SENTRY_DSN \
              --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
              --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
              --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT
          done
      # Gradle can only refuse to fall back to the debug key; it cannot tell
      # whether the file it was handed is the upload key. So it is read back.
      - name: Check the APK carries the upload signature
        run: |
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "Signed with the debug key - Play would reject this."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  linux:
    name: linux
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # A JDK because the `jni` plugin's find_package(JNI) runs on Linux too
      # and CMake stops without it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Four packages beyond Flutter's official Linux list, each for one
      # dependency: gstreamer for audioplayers_linux, libcurl for
      # sentry-native, and libsecret for flutter_secure_storage_linux, whose
      # CMakeLists does `pkg_check_modules(libsecret-1>=0.18.4)` and stops the
      # build dead without it.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libcurl4-openssl-dev libsecret-1-dev libjsoncpp-dev
      - name: Build the Linux bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RYBBIT_HOST: ${{ secrets.RYBBIT_HOST }}
          RYBBIT_SITE_ID: ${{ secrets.RYBBIT_SITE_ID }}
          TELEMETRY_ENVIRONMENT: ${{ secrets.TELEMETRY_ENVIRONMENT }}
        working-directory: apps/mobile
        run: |
          test -n "$SENTRY_DSN" && test -n "$RYBBIT_HOST"
          flutter pub get
          flutter build linux --release \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=RYBBIT_HOST=$RYBBIT_HOST \
            --dart-define=RYBBIT_SITE_ID=$RYBBIT_SITE_ID \
            --dart-define=TELEMETRY_ENVIRONMENT=$TELEMETRY_ENVIRONMENT
      # Tarred rather than handed over as a directory, because the artifact
      # upload drops the executable bit and the result would not run.
      - name: Package the bundle
        working-directory: apps/mobile/build/linux/x64/release
        run: tar -czf nks-talk-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: apps/mobile/build/linux/x64/release/nks-talk-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: windows
    # Not on every push: Windows minutes bill at 2x and this job is 90 of the
    # ~145 billed minutes a full run costs, for a target that builds locally in
    # four minutes. It runs when someone asks for it, and on a release tag,
    # which is when the installer is actually wanted.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write a placeholder Firebase config
        shell: bash
        run: |
          cat > apps/mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.nkshub.nextcloudtalk"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
      # Repeated here rather than reused from the `test` job: the two
      # windows_notification_integration_test cases drive the native Windows
      # channel and skip on every other platform.
      - name: Test talk_protocol
        working-directory: packages/talk_protocol
        shell: bash
        run: |
          dart pub get
          dart analyze lib test
          dart test --reporter expanded
      # Gradle, warmed before the suite instead of inside it. The one test that
      # shells out to the wrapper timed out after ten minutes here while
      # finishing comfortably on Ubuntu: a cold Gradle on Windows spends that
      # long fetching the wrapper, AGP and Kotlin onto NTFS with Defender
      # watching every write. As its own step the wait is visible, and the test
      # then hits a warm cache.
      - name: Warm the Gradle cache
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter pub get
          cd android
          ./gradlew :app:processDebugMainManifest --quiet
      - name: Test apps/mobile
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter analyze lib test
          flutter test --reporter expanded
      - name: Build the Windows bundle
        env:
          # local_auth_windows still includes <experimental/coroutine>, which
          # MSVC 14.51 on this runner turns into a hard error (STL1011). The
          # compiler reads CL for extra switches, so the plugin builds without
          # patching third-party sources. Local VS 2022 never hits it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RYBBIT_HOST: ${{ secrets.RYBBIT_HOST }}
          RYBBIT_SITE_ID: ${{ secrets.RYBBIT_SITE_ID }}
          TELEMETRY_ENVIRONMENT: ${{ secrets.TELEMETRY_ENVIRONMENT }}
        working-directory: apps/mobile
        run: |
          if (-not $env:SENTRY_DSN -or -not $env:RYBBIT_HOST) { exit 1 }
          flutter build windows --release --dart-define=SENTRY_DSN=$env:SENTRY_DSN --dart-define=RYBBIT_HOST=$env:RYBBIT_HOST --dart-define=RYBBIT_SITE_ID=$env:RYBBIT_SITE_ID --dart-define=TELEMETRY_ENVIRONMENT=$env:TELEMETRY_ENVIRONMENT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # build_installer.ps1 finds ISCC.exe in the default install location on
      # its own, so nothing needs a path here.
      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The script hashes every file in the bundle into a manifest, refuses an
      # incomplete or symlinked bundle, and prints the installer's SHA-256.
      - name: Build the installer
        run: |
          & ./apps/mobile/windows/installer/build_installer.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/mobile/build/windows/installer/*.exe
          if-no-files-found: error

  # One release per tag, with everything the three GitHub jobs produced. The
  # macOS zip and the iOS build are NOT here and no longer come from any CI:
  # since 5 September 2026 the Apple targets are built and released from
  # `build-mac` by the owner's decision (Codemagic is dormant, see codemagic.yaml).
  # The zip is attached to this release by hand from that host, with its own
  # `nks-talk-macos.zip.sha256` next to it.
  # No iOS artefact by design - a store-signed IPA installs from TestFlight and
  # nowhere else, so a download link would only mislead.
  release:
    name: github release
    needs: [android, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Full history: the notes are built from the commits since the previous
      # tag, and a shallow clone has neither the tags nor the range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files and hash them
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.aab' \
            -o -name '*.tar.gz' -o -name '*.exe' \) -exec cp {} release/ \;
          version=$(sed -n 's/^version: *//p' apps/mobile/pubspec.yaml)
          echo "RELEASE_NAME=NKS Talk ${version%+*} (${version#*+})" >> "$GITHUB_ENV"
          # The changelog keeps SHA-256 for every artefact, so the release
          # carries the same list rather than a different one.
          ( cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS )
      # English, and from the commits rather than the changelog: CHANGELOG.md
      # is written in Czech for the wiki and the store listings, while the
      # repository - commits, code, this file - is English. A release page is
      # repository-facing, so it follows the repository.
      - name: Write the release notes
        run: |
          version=$(sed -n 's/^version: *//p' apps/mobile/pubspec.yaml)
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous."
            else
              echo "First tagged release of this line."
            fi
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..${GITHUB_REF_NAME}"                 | grep -E '^- (feat|fix|perf)' || echo "- Maintenance only; see the commit log."
            fi
            echo
            echo "Artifacts below are signed release builds. \`SHA256SUMS\` lists the checksums of the ones built here; the macOS zip is built on Codemagic and carries its own \`nks-talk-macos.zip.sha256\`."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true

  # Publishing, on a release tag only. `v*` alone would let a stray tag ship to
  # testers, and pulling a build back off Play is not a clean operation, so the
  # tag has to match `v<pubspec version>` exactly - build number included.
  play:
    name: play alpha
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag names this build
        run: |
          tag=${GITHUB_REF#refs/tags/}
          version=$(sed -n 's/^version: *//p' apps/mobile/pubspec.yaml)
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match pubspec version $version - refusing to publish."
            exit 1
          fi
          echo "VERSION_CODE=${version#*+}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts
      - name: Install the Play client
        run: pip install --quiet google-api-python-client google-auth
      # Play rejects a version code it already has, but only after the whole
      # AAB has been uploaded. Asking first turns a late upload error into an
      # immediate one.
      - name: Check the version code is new
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > key.json
          python - <<'PY'
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          pkg, want = "com.nkshub.nextcloudtalk", int(os.environ["VERSION_CODE"])
          svc = build("androidpublisher", "v3", cache_discovery=False,
                      credentials=Credentials.from_service_account_file("key.json"))
          edit = svc.edits().insert(packageName=pkg, body={}).execute()["id"]
          try:
              taken = {c for t in svc.edits().tracks().list(packageName=pkg, editId=edit)
                       .execute().get("tracks", [])
                       for r in t.get("releases", []) for c in r.get("versionCodes", [])}
          finally:
              svc.edits().delete(packageName=pkg, editId=edit).execute()
          if str(want) in {str(c) for c in taken}:
              raise SystemExit(f"version code {want} is already on Play: {sorted(taken)}")
          print(f"version code {want} is free; Play has {sorted(taken)}")
          PY
      # Committed notes win when they exist - the ones earlier releases shipped
      # were written by hand, and `apps/mobile/release-notes` holds them again.
      # The fallback below is now a last resort and no longer honest on its own:
      # it labels the changelog's top section `cs-CZ`, and since every document
      # in this repository was translated the changelog is English. It also cuts
      # at 500 BYTES, which can split a multi-byte character in half. Keep the
      # committed files under the cap and the fallback never runs.
      - name: Collect the release notes
        run: |
          mkdir -p whatsnew
          if [ -d apps/mobile/release-notes ]; then
            cp apps/mobile/release-notes/whatsnew-* whatsnew/
          else
            awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > whatsnew/whatsnew-cs-CZ
          fi
          for f in whatsnew/whatsnew-*; do
            # Play caps each locale at 500 characters and fails the whole edit
            # on the first one over, so they are cut here rather than there.
            head -c 500 "$f" > "$f.cut" && mv "$f.cut" "$f"
            echo "$f: $(wc -c < "$f") bytes"
          done
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nkshub.nextcloudtalk
          releaseFiles: artifacts/bundle/release/*.aab
          track: alpha
          status: completed
          whatsNewDirectory: whatsnew
