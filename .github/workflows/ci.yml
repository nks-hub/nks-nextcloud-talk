name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  quality:
    name: Protocol and Flutter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve protocol dependencies
        working-directory: packages/talk_protocol
        run: dart pub get

      - name: Analyze protocol
        working-directory: packages/talk_protocol
        run: dart analyze --fatal-infos

      - name: Test protocol
        working-directory: packages/talk_protocol
        run: dart test

      - name: Resolve mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze --no-pub

      - name: Test mobile
        working-directory: apps/mobile
        run: flutter test --no-pub

      - name: Scan tracked source for secrets
        working-directory: apps/mobile
        run: python3 tool/secret_log_scan.py

  platform-build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
            java: true
          - target: linux
            runner: ubuntu-24.04
            java: false
          - target: windows
            runner: windows-2022
            java: true
          - target: macos
            runner: macos-15
            java: false
          - target: ios-simulator
            runner: macos-15
            java: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Java
        if: matrix.java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android
        if: matrix.target == 'android'
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: apps/mobile
        run: flutter build linux --debug --no-pub

      - name: Build Windows
        if: matrix.target == 'windows'
        working-directory: apps/mobile
        run: flutter build windows --debug --no-pub

      - name: Build macOS
        if: matrix.target == 'macos'
        working-directory: apps/mobile
        run: flutter build macos --debug --no-pub

      - name: Build iOS simulator
        if: matrix.target == 'ios-simulator'
        working-directory: apps/mobile
        run: flutter build ios --simulator --debug --no-pub
